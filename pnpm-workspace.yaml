packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  "@eslint/js": 10.0.1
  "@types/node": 24.19.2
  eslint: 10.14.0
  eslint-config-prettier: 10.1.8
  globals: 17.14.0
  husky: 9.1.7
  lint-staged: 17.6.0
  prettier: 3.9.10
  turbo: 2.11.10
  typescript: 7.0.2
  typescript-eslint: 8.72.1
  zod: 4.6.7

engineStrict: true

# Packages allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - "@medusajs/telemetry"
  - "@swc/core"
  - esbuild

# tsconfig-paths: required by the Medusa CLI (same override as Medusa's official starter).
overrides:
  tsconfig-paths: ^4.2.0

# @nuxt/schema imports vite's types but only lists it as a dev dependency, so it would read whichever
# vite is hoisted. Medusa's admin needs vite 7 and Nuxt needs vite 8: this keeps Nuxt on its own.
packageExtensions:
  "@nuxt/schema":
    dependencies:
      vite: 8.3.6
