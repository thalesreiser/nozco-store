name: Security

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    # Mondays 06:00 BRT: catches advisories published after the last change.
    - cron: "0 9 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  dependency-audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Reads pnpm-lock.yaml only, so no install is needed.
      - run: pnpm audit --audit-level high

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # On pull requests and pushes the action scans only the new commits, whatever the fetch depth.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          # A comment needs a write token and would point at the secret in a public thread.
          GITLEAKS_ENABLE_COMMENTS: "false"
      # The action leaves this binary on PATH. Without log options it scans every fetched ref.
      - name: Scan the full history
        run: gitleaks git --no-banner --redact --exit-code 1 .
